
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأخبار الذكية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-blue-600 text-white p-2 rounded-xl font-black text-xl shadow-md">📰</div>
                <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">نبض الأخبار</h1>
            </div>
            <div class="text-xs bg-slate-700 text-emerald-400 px-3 py-1.5 rounded-full font-semibold border border-slate-600 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                متصل بقاعدة البيانات
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        <!-- Hero Section -->
        <div class="mb-10 text-center">
            <h2 class="text-3xl md:text-4xl font-extrabold mb-3">آخر الأخبار المحدثة تلقائياً</h2>
            <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">تغطية حية ومستمرة يتم جلبها بواسطة روبوت ذكي على مدار الساعة.</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 font-medium">جاري جلب أحدث الأخبار...</p>
        </div>

        <!-- Error State -->
        <div id="error-box" class="hidden bg-rose-950/50 border border-rose-800 text-rose-200 p-4 rounded-xl text-center max-w-lg mx-auto mb-8">
            <p id="error-message">حدث خطأ أثناء جلب البيانات.</p>
        </div>

        <!-- News Grid -->
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم تعبئة المقالات هنا برمجياً -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-8 mt-12 text-center text-sm text-slate-400">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <p>جميع الحقوق محفوظة © 2026 - تم التشغيل عبر Supabase و GitHub Actions</p>
            
            <!-- رابط وأيقونة اليوتيوب -->
            <div class="flex items-center gap-2">
                <span class="text-slate-300">تابع قناتنا:</span>
                <a href="https://www.youtube.com/@eisaali240" target="_blank" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl font-medium flex items-center gap-2 transition-colors shadow-md">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    يوتيوب
                </a>
            </div>
        </div>
    </footer>

    <!-- Script to Fetch and Render News -->
    <script>
        const SUPABASE_URL = 'https://bbqkiwnpcmhtxvrprzeb.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // استبدل هذا بمفتاح الـ Anon الخاص بك

        async function fetchNews() {
            const loadingEl = document.getElementById('loading');
            const gridEl = document.getElementById('news-grid');
            const errorEl = document.getElementById('error-box');
            const errorMsgEl = document.getElementById('error-message');

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/news?select=*&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error('فشل الاتصال بقاعدة البيانات لجلب الأخبار.');
                }

                const articles = await response.json();
                loadingEl.style.display = 'none';

                if (!articles || articles.length === 0) {
                    gridEl.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">لا توجد أخبار مضافة حتى الآن.</div>';
                    return;
                }

                gridEl.innerHTML = articles.map(article => `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-lg hover:border-blue-500 transition-all duration-300 flex flex-col justify-between">
                        <div class="p-6">
                            <div class="flex items-center justify-between mb-3 text-xs text-slate-400">
                                <span class="bg-blue-900/50 text-blue-300 px-2.5 py-1 rounded-md font-medium border border-blue-800/50">خبر جديد</span>
                                <span>${article.created_at ? new Date(article.created_at).toLocaleDateString('ar-SA') : 'حديث'}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-100 mb-3 leading-snug hover:text-blue-400 transition-colors">
                                ${article.title || 'بدون عنوان'}
                            </h3>
                            <p class="text-slate-400 text-sm line-clamp-3 leading-relaxed">
                                ${article.content || article.description || 'لا يوجد وصف متاح لهذا الخبر حالياً.'}
                            </p>
                        </div>
                        <div class="px-6 py-4 bg-slate-850 border-t border-slate-700/50 flex justify-between items-center">
                            <a href="${article.url || '#'}" target="_blank" class="text-blue-400 hover:text-blue-300 text-sm font-semibold inline-flex items-center gap-1.5 transition-colors">
                                قراءة المصدر
                                <svg class="w-4 h-4 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                loadingEl.style.display = 'none';
                errorEl.classList.remove('hidden');
                errorMsgEl.textContent = 'حدث خطأ أثناء تحميل الأخبار: ' + err.message;
            }
        }

        fetchNews();
    </script>
</body>
</html>
